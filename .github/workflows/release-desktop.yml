name: Release desktop

# The Electron app (apps/desktop) for macOS, Linux and Windows. A v* tag publishes it; anything
# else is a dry run that builds but publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/release-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same PR supersedes the run in progress; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Version matches the host
        # The host's minApp is compared with this app's version (docs/reference/compatibility.md).
        run: |
          APP=$(node -p 'require("./package.json").version')
          HOST=$(python3 -c 'import tomllib; print(tomllib.load(open("../../host/Cargo.toml", "rb"))["package"]["version"])')
          test "$APP" = "$HOST" || { echo "apps/desktop ($APP) and host ($HOST) versions must match"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build


  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Build
        working-directory: apps/desktop
        # Unsigned for now: SmartScreen warns on first launch until the app has a code signing certificate.
        run: |
          npm ci
          npm run dist:win:main -- --publish never
          cd dist
          sha256sum codync-windows-x64.exe > codync-windows-x64.exe.sha256
      - name: Smoke test the bundled host
        working-directory: apps/desktop/dist/win-unpacked/resources
        run: |
          ./codync-host.exe --version
          CODYNC_HOME="$RUNNER_TEMP/codync" ./codync-host.exe serve --port 19333 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19333/health && break; sleep 1; done
          curl -sf http://127.0.0.1:19333/health | grep -q computerId
          TOKEN=$(cat "$RUNNER_TEMP/codync/token")
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:19333/api/refreshBackends
      - name: Update feed
        working-directory: apps/desktop/dist
        # Windows bundles the host: PCs with iPhones wait until the App Store has the app it needs.
        run: |
          MIN_APP=$(win-unpacked/resources/codync-host.exe compat | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).minApp')
          printf 'minApp: %s\n' "$MIN_APP" >> latest.yml
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-windows-x64
          path: |
            apps/desktop/dist/codync-windows-x64.exe
            apps/desktop/dist/latest.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/dist/codync-windows-x64.exe
            apps/desktop/dist/codync-windows-x64.exe.sha256
            apps/desktop/dist/codync-windows-x64.exe.blockmap
      # The update feed last, once the installer it points at is downloadable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/dist/latest.yml

  linux:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The Linux app uses the installed codync-host (codync-host-linux-*.tar.gz, host.yml).
      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist:linux:main -- --${{ matrix.arch }} --publish never
          # The website links releases/latest/download/codync-<os>-<arch>.tar.gz.
          cd dist
          # electron-builder names x64 tar.gz `x64` and deb `amd64`; the update feed follows the renames.
          for f in codync-linux-x64.* codync-linux-amd64.*; do
            [ -e "$f" ] || continue
            to="codync-${{ matrix.name }}.${f#*.}"
            mv "$f" "$to"
            sed -i "s|$f|$to|g" latest-linux*.yml
          done
          for f in codync-${{ matrix.name }}.*; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-${{ matrix.name }}
          path: apps/desktop/dist/codync-${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/dist/codync-${{ matrix.name }}.*
      # The update feed last, once the packages it points at are downloadable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/dist/latest-linux*.yml

  macos:
    needs: check
    # The Icon Composer app icon (resources/AppIcon.icon) needs Xcode 26's actool.
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Generate the Xcode project
        # project.yml is the source of truth for the screen helper's version and build settings.
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec apps/project.yml
      - name: Install Rosetta (for x86_64 builds on Apple Silicon)
        run: softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
      - name: Build the speech helper (universal)
        working-directory: apps/desktop/native/speech-macos
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          lipo -create .build/arm64-apple-macosx/release/codync-speech .build/x86_64-apple-macosx/release/codync-speech -output ../../build/native/codync-speech
      - name: Draw the DMG background
        run: swift packaging/dmg/background.swift apps/desktop/build/dmg-background.tiff
      - name: Build
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Without a Developer ID certificate this fork still produces a DMG, unsigned and not
        # notarized (Gatekeeper warns on first launch). With CSC_LINK the normal signed and
        # notarized release runs instead.
        run: |
          npm ci
          if [ -n "$CSC_LINK" ]; then
            # A certificate without Apple credentials still signs, it just cannot notarize.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              npm run dist:mac:main -- --publish never
            else
              npm run dist:mac:main -- --publish never -c.mac.notarize=false
            fi
            codesign -d --entitlements - dist/mac-universal/Codync.app | grep -q com.apple.security.device.audio-input ||
              { echo "audio-input entitlement missing"; exit 1; }
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac:main -- --publish never -c.mac.notarize=false
          fi
          cd dist
          shasum -a 256 codync-macos.dmg codync-macos.zip > codync-macos.sha256
      - name: Smoke test the bundled host
        working-directory: apps/desktop/dist/mac-universal/Codync.app/Contents/Resources
        run: |
          ./codync-host --version
          CODYNC_HOME="$RUNNER_TEMP/codync" ./codync-host serve --port 19333 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19333/health && break; sleep 1; done
          curl -sf http://127.0.0.1:19333/health | grep -q computerId
          TOKEN=$(cat "$RUNNER_TEMP/codync/token")
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:19333/api/refreshBackends
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-macos
          path: |
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/codync-macos.zip
            apps/desktop/dist/codync-macos.sha256
            apps/desktop/dist/latest-mac.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/codync-macos.zip
            apps/desktop/dist/codync-macos.sha256
      # The update feed last, once the packages it points at are downloadable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/dist/latest-mac.yml
