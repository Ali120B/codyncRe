name: android

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble dev debug
        run: ./gradlew :app:assembleDevDebug
      - name: Unit tests
        run: ./gradlew :core:model:test :app:testDevDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDevDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codync-android-dev-debug
          path: apps/android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
