name: android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install SDK packages
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble dev debug
        run: ./gradlew :app:assembleDevDebug
      - name: Unit tests
        run: ./gradlew :core:model:test :app:testDevDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDevDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codync-android-dev-debug
          path: apps/android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install SDK packages
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare keystore
        run: |
          keytool -genkeypair -v -keystore codync-release.jks -alias codync -keyalg RSA -keysize 2048 -validity 10000 -storepass codync-release -keypass codync-release -dname "CN=codync,OU=codync,O=codync,L=Sharjah,ST=Sharjah,C=AE"
      - name: Assemble prod release
        env:
          CODYNC_KEYSTORE_PASSWORD: codync-release
          CODYNC_KEY_ALIAS: codync
          CODYNC_KEY_PASSWORD: codync-release
        run: |
          export CODYNC_KEYSTORE_FILE="$(pwd)/codync-release.jks"
          ./gradlew :app:assembleProdRelease
      - name: Locate APK
        run: find . -name "*.apk" -print
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/prod/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
