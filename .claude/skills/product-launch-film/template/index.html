<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Product — launch film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: Geist; font-weight: 100 900; src: url("assets/fonts/geist.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url("assets/fonts/geist-mono.woff2") format("woff2"); }
      :root { --ink: #0b0b0c; --accent: #ff6200; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--ink);
        font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased;
      }
      .scene { position: absolute; inset: 0; visibility: hidden; opacity: 0; }
      .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      .accent { color: var(--accent); }

      /* cards */
      .line {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 68px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.16; white-space: nowrap;
      }
      .lt { display: flex; align-items: center; }
      .w { display: inline-block; white-space: pre; opacity: 0; }
      .eyebrow { font-size: 19px; font-weight: 600; letter-spacing: 0.16em; color: var(--accent); margin-bottom: 18px; opacity: 0; }
      #noun-slot { position: relative; display: block; }
      .noun { position: absolute; left: 0; top: 0; display: block; opacity: 0; }
      .noun.final { position: relative; }

      /* the mark (replace with <img src="assets/icon.png">) */
      .icw { position: relative; display: block; margin: 0 20px 0 4px; }
      .mark { display: block; width: 78px; height: 78px; border-radius: 20px; background: var(--accent); opacity: 0; }
      .mark.big { width: 124px; height: 124px; border-radius: 30px; }
      .clip { display: block; overflow: hidden; padding: 8px 6px 8px 0; }
      .name { display: block; opacity: 0; }
      #lk-name { font-size: 112px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; }
      #lk-sub { margin-top: 36px; font-size: 30px; font-weight: 400; letter-spacing: -0.01em; color: #8e8e93; display: flex; }

      /* halftone */
      #ht { position: absolute; inset: 0; opacity: 0; }
      #ht div { position: absolute; inset: 0; background-size: 100% 100%; }
      #ht-b { opacity: 0; }
      .wipe {
        position: absolute; inset: -22px; visibility: hidden; opacity: 0; --r: 0;
        background-image: radial-gradient(circle, #fff calc(var(--r) * 1px), rgba(255, 255, 255, 0) calc(var(--r) * 1px + 1.5px));
        background-size: 44px 44px;
      }
      .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      .burst i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 5px; background: var(--ink); opacity: 0; display: block; }

      /* wheel */
      #wheel-label { position: absolute; right: 1150px; top: 500px; height: 80px; display: flex; align-items: center; font-size: 46px; font-weight: 500; letter-spacing: -0.03em; white-space: nowrap; }
      #wheel { position: absolute; left: 160px; top: 540px; width: 0; height: 0; }
      .spoke { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
      .item { position: absolute; left: 640px; top: -40px; height: 80px; display: flex; align-items: center; font-size: 46px; font-weight: 500; letter-spacing: -0.03em; white-space: nowrap; opacity: 0; }

      /* phone */
      .phone {
        position: absolute; top: 114px; width: 393px; height: 852px; border-radius: 56px;
        box-shadow: 0 0 0 10px var(--ink), 0 0 0 11.5px #3b3b3e, 0 50px 100px rgba(0, 0, 0, 0.13), 0 16px 32px rgba(0, 0, 0, 0.07);
      }
      .screen { position: absolute; inset: 0; border-radius: 56px; overflow: hidden; background: #fdfdfd; color: #141414; letter-spacing: -0.01em; }
      .island { position: absolute; left: 134.5px; top: 12px; width: 124px; height: 36px; border-radius: 20px; background: #000; }
      .view { position: absolute; left: 0; right: 0; top: 112px; height: 656px; overflow: hidden; }
      .msgs { position: absolute; left: 16px; right: 16px; top: 0; }
      .m { position: absolute; left: 0; right: 0; display: flex; }
      .m.user { justify-content: flex-end; }
      .b { max-width: 296px; padding: 9px 14px; border-radius: 21px; font-size: 16px; line-height: 21px; }
      .user .b { background: #e2e2e2; }
      .agent .b { background: #f0f0f0; }
      .pop { opacity: 0; transform-origin: 0 100%; }
      .user .pop { transform-origin: 100% 100%; }
      .btn { margin-top: 10px; height: 46px; border-radius: 16px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-weight: 600; }
      .touch, .ripple { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 23px; opacity: 0; }
      .touch { background: rgba(20, 20, 20, 0.2); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7) inset, 0 2px 8px rgba(0, 0, 0, 0.12); z-index: 9; }
      .ripple { border: 2px solid rgba(20, 20, 20, 0.35); z-index: 8; }
    </style>
  </head>
  <body>
    <!-- data-duration = whole bars of the chosen bpm -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.71" data-width="1920" data-height="1080">
      <div id="ht"><div id="ht-a"></div><div id="ht-b"></div></div>

      <div class="scene" id="s-cards">
        <div class="line" id="c-pain"><div class="lt"><span data-split>Shipping got complicated.</span></div></div>
        <div class="line" id="c-meet">
          <div class="lt">
            <span class="w">Meet </span>
            <span class="icw"><span class="mark" id="meet-mark"></span><span class="burst" id="burst-meet"></span></span>
            <span class="clip"><span class="name" id="meet-name">Product</span></span>
          </div>
        </div>
        <div class="line" id="c-your">
          <div class="lt">
            <span class="w" id="your-w">Your </span>
            <span id="noun-slot">
              <span class="noun">laptop.</span>
              <span class="noun">phone.</span>
              <span class="noun final accent">whole team.</span>
            </span>
          </div>
        </div>
      </div>

      <div class="scene" id="s-wheel">
        <div id="wheel-label"><span data-split>Ask it to</span></div>
        <div id="wheel"></div>
      </div>

      <div class="scene" id="s-hero"><div class="cam" id="cam-hero"></div></div>

      <div class="scene" id="s-end">
        <div class="line" id="c-tag">
          <div class="lt"><span data-split>The one sentence</span></div>
          <div class="lt accent"><span data-split>people remember.</span></div>
        </div>
        <div class="line" id="c-lock">
          <div class="lt">
            <span class="icw"><span class="mark big" id="lk-mark"></span><span class="burst" id="burst-lk"></span></span>
            <span class="clip"><span class="name" id="lk-name">Product</span></span>
          </div>
          <div id="lk-sub"><span data-split>product.dev</span></div>
        </div>
      </div>
      <div class="wipe" id="wipe1"></div>

      <!-- audio: static start times, read them off window.__marks after any timing change.
           Music: add an <audio id="bgm"> for assets/bgm/bed.mp3 (data-start 0, full duration, track 10, volume 0.85). -->
      <audio id="sfx-0" src="assets/sfx/pop-a.mp3" data-start="0.3" data-duration="0.26" data-track-index="20" data-volume="0.1"></audio>
      <audio id="sfx-1" src="assets/sfx/pop-d.mp3" data-start="3.21" data-duration="0.26" data-track-index="21" data-volume="0.16"></audio>
      <audio id="sfx-2" src="assets/sfx/chime.mp3" data-start="23.57" data-duration="2.14" data-track-index="22" data-volume="0.25"></audio>
    </div>

    <script>
      function build() {
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        /* ── music grid ── */
        const BPM = 112, BEAT = 60 / BPM, BAR = BEAT * 4;
        const bar = (n) => n * BAR;

        /* ── DOM ── */
        // halftone corner fields: dots shrink away from two opposite corners
        function htField(heavy, light) {
          const c = document.createElement("canvas");
          c.width = 1920; c.height = 1080;
          const ctx = c.getContext("2d"), step = 44, f = [{ x: heavy[0], y: heavy[1], r: 980 }, { x: light[0], y: light[1], r: 540 }];
          ctx.fillStyle = "rgba(11,11,12,0.11)";
          for (let y = step / 2; y < 1080; y += step) for (let x = step / 2; x < 1920; x += step) {
            const r = step * 0.46 * Math.max(...f.map((k) => 1 - Math.hypot(x - k.x, y - k.y) / k.r));
            if (r > step * 0.07) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
          }
          return `url(${c.toDataURL("image/png")})`;
        }
        $("#ht-a").style.backgroundImage = htField([1920, 1080], [0, 0]);
        $("#ht-b").style.backgroundImage = htField([0, 1080], [1920, 0]);
        $$(".burst").forEach((b) => (b.innerHTML = "<i></i>".repeat(16)));

        // split [data-split] text into .w words
        $$("[data-split]").forEach((el) => {
          const words = el.textContent.trim().split(" ");
          el.textContent = "";
          el.style.display = "flex";
          words.forEach((w, i) => {
            const s = document.createElement("span");
            s.className = "w";
            s.textContent = w + (i < words.length - 1 ? " " : "");
            el.appendChild(s);
          });
        });

        // wheel of concrete jobs
        const JOBS = ["fix the failing checks.", "review the pull request.", "write the changelog.", "run the benchmarks.", "ship it."];
        const DEG = 9, wheel = $("#wheel");
        JOBS.forEach((t, i) => {
          const sp = document.createElement("div");
          sp.className = "spoke";
          sp.style.transform = `rotate(${i * DEG}deg)`;
          sp.innerHTML = `<div class="item" data-layout-allow-overlap>${t}</div>`;
          wheel.appendChild(sp);
        });
        const items = $$(".item", wheel);

        // phone factory: rebuild the product's real screens here, with its own tokens
        function phone(x) {
          const el = document.createElement("div");
          el.className = "phone";
          el.style.left = x - 196.5 + "px";
          el.innerHTML = `<div class="screen"><div class="view"><div class="msgs"></div></div><div class="island"></div><div class="ripple"></div><div class="touch"></div></div>`;
          return el;
        }
        function layout(parent, gap) {
          let y = 0;
          Array.from(parent.children).forEach((m) => { m.style.top = y + "px"; m._top = y; m._h = m.offsetHeight; y += m._h + gap; });
          return y - gap;
        }
        const rel = (el, anc) => { const a = el.getBoundingClientRect(), b = anc.getBoundingClientRect(); return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2 }; };
        const camHero = $("#cam-hero"), P = phone(960);
        camHero.appendChild(P);
        const ms = $(".msgs", P);
        ms.innerHTML =
          `<div class="m user"><div class="b">Can you fix the failing check?</div></div>` +
          `<div class="m agent"><div class="b">It needs to edit <code>src/week.js</code>.<div class="btn" id="allow">Allow once</div></div></div>` +
          `<div class="m agent"><div class="b pop">Done. All 5 checks pass.</div></div>`;
        const H = layout(ms, 10), msgs = $$(".m", ms), HV = 656;
        const msY = (i) => Math.min(8, HV - 12 - (msgs[i]._top + msgs[i]._h));
        const allow = rel($("#allow"), P);

        /* ── timeline helpers ── */
        const tl = gsap.timeline({ paused: true });
        const blur = (n) => `blur(${n}px)`;
        const show = (el, t) => tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, t);
        const hide = (el, t) => tl.to(el, { autoAlpha: 0, duration: 0.01, ease: "none" }, t);
        const words = (sel) => (typeof sel === "string" ? $$(sel + " .w") : sel);
        const wIn = (sel, t, o = {}) => tl.fromTo(words(sel), { y: 20, opacity: 0, filter: blur(12) }, { y: 0, opacity: 1, filter: blur(0), duration: o.d || 0.7, ease: "power3.out", stagger: o.s || 0.075 }, t);
        const wOut = (sel, t, o = {}) => tl.to(words(sel), { y: -22, opacity: 0, filter: blur(10), duration: 0.45, ease: "power2.in", stagger: o.s || 0.04 }, t);
        const cam = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
        const pop = (el, t) => tl.fromTo(el, { opacity: 0, scale: 0.9, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        function tap(root, x, y, t, from) {
          const dot = $(".touch", root), rip = $(".ripple", root);
          tl.fromTo(dot, { x: from.x, y: from.y, opacity: 0, scale: 1 }, { x, y, opacity: 1, duration: 0.6, ease: "power2.inOut" }, t - 0.72);
          tl.to(dot, { scale: 0.76, duration: 0.09, ease: "power2.out" }, t - 0.02);
          tl.to(dot, { scale: 1, duration: 0.22, ease: "power2.out" }, t + 0.1);
          tl.to(dot, { opacity: 0, duration: 0.3 }, t + 0.32);
          tl.fromTo(rip, { x, y, scale: 0.8, opacity: 0.55 }, { scale: 2.3, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t);
        }
        const htOn = (t) => tl.to("#ht", { opacity: 1, duration: 0.7, ease: "power2.out" }, t);
        const htOff = (t) => tl.to("#ht", { opacity: 0, duration: 0.5, ease: "power2.in" }, t);
        const htSwap = (t, toB) => { tl.to("#ht-a", { opacity: toB ? 0 : 1, duration: 0.9, ease: "sine.inOut" }, t); tl.to("#ht-b", { opacity: toB ? 1 : 0, duration: 0.9, ease: "sine.inOut" }, t); };
        function wipe(id, t) {
          tl.set(id, { autoAlpha: 1 }, t);
          tl.fromTo(id, { "--r": 0 }, { "--r": 32, duration: 0.8, ease: "power2.in", immediateRender: false }, t);
          tl.to(id, { autoAlpha: 0, duration: 0.45, ease: "power1.out" }, t + 0.95);
        }
        function burst(id, t) {
          $$(id + " i").forEach((d, i) => {
            const a = (i / 16) * Math.PI * 2 + 0.3, R = 120 + (i % 3) * 34;
            tl.fromTo(d, { x: Math.cos(a) * R, y: Math.sin(a) * R, scale: 1.5, opacity: 0 }, { x: 0, y: 0, scale: 0.4, opacity: 1, duration: 0.42, ease: "power3.in" }, t + (i % 4) * 0.025);
            tl.set(d, { opacity: 0 }, t + 0.42 + (i % 4) * 0.025);
          });
        }
        const markIn = (mark, name, t) => {
          tl.fromTo(mark, { opacity: 0, scale: 0.3, rotation: -30, filter: blur(8) }, { opacity: 1, scale: 1, rotation: 0, filter: blur(0), duration: 0.8, ease: "power4.out" }, t);
          tl.fromTo(name, { xPercent: -45, opacity: 0, filter: blur(8) }, { xPercent: 0, opacity: 1, filter: blur(0), duration: 0.85, ease: "power3.out" }, t + 0.28);
        };
        tl.fromTo("#ht", { scale: 1 }, { scale: 1.08, duration: 25.71, ease: "none" }, 0);

        /* ══ beats, in film order ═══════════════════════════════ */

        /* the pain, named */
        show("#s-cards", 0);
        htOn(0.1);
        wIn("#c-pain", 0.3);
        wOut("#c-pain", 2.7);

        /* Meet ▣ Product — the mark lands on bar 1.5 */
        const TM = bar(1.5);
        wIn([$("#c-meet .w")], TM - 0.27);
        burst("#burst-meet", TM - 0.36);
        markIn("#meet-mark", "#meet-name", TM);
        tl.to($$("#c-meet .w, #meet-mark, #meet-name"), { y: -22, opacity: 0, filter: blur(10), duration: 0.45, ease: "power2.in", stagger: 0.05 }, TM + 2.0);

        /* Your <rotating noun> */
        const TY = TM + 2.5, nouns = $$(".noun");
        wIn([$("#your-w")], TY);
        nouns.forEach((n, i) => {
          const t = TY + 0.15 + i * BEAT * 1.5;
          tl.fromTo(n, { y: 22, opacity: 0, filter: blur(10) }, { y: 0, opacity: 1, filter: blur(0), duration: 0.55, ease: "power3.out" }, t);
          if (i < nouns.length - 1) tl.to(n, { y: -22, opacity: 0, filter: blur(10), duration: 0.32, ease: "power2.in" }, t + BEAT * 1.5 - 0.2);
        });
        const TYo = TY + 0.15 + nouns.length * BEAT * 1.5 + 0.6;
        tl.to([$("#your-w"), nouns[nouns.length - 1]], { y: -22, opacity: 0, filter: blur(10), duration: 0.45, ease: "power2.in", stagger: 0.05 }, TYo);
        hide("#s-cards", TYo + 0.6);

        /* the wheel: one job per 0.75 beat */
        const TW = TYo + 0.35;
        show("#s-wheel", TW);
        wIn("#wheel-label", TW + 0.1);
        const fo = (d) => (d < 0.5 ? 1 : d < 1.5 ? 0.5 : d < 2.5 ? 0.22 : d < 3.5 ? 0.07 : 0);
        const fb = (d) => (d < 0.5 ? 0 : d < 1.5 ? 0.7 : d < 2.5 ? 1.8 : 3.6);
        function wheelTo(k, t, d, ease) {
          tl.to(wheel, { rotation: -k * DEG, duration: d, ease }, t);
          items.forEach((it, i) => tl.to(it, { opacity: fo(Math.abs(i - k)), filter: blur(fb(Math.abs(i - k))), duration: d, ease }, t));
        }
        tl.set(wheel, { rotation: 4 * DEG }, TW);
        wheelTo(0, TW + 0.35, 0.9, "power3.out");
        let wt = TW + 1.35;
        for (let k = 1; k < JOBS.length; k++) { wheelTo(k, wt, 0.34, "power2.inOut"); wt += BEAT * 0.75; }
        wheelTo(JOBS.length + 3, wt + 0.4, 0.6, "power2.in");
        wOut("#wheel-label", wt + 0.45);
        hide("#s-wheel", wt + 1.15);
        const THo = wt + 0.8;
        htOff(THo - 0.35);

        /* hero flow: open → push in → tap → result → pull back */
        show("#s-hero", THo);
        tl.set(ms, { y: msY(1) }, THo);
        tl.fromTo(P, { autoAlpha: 0, scale: 0.9, y: 40, filter: blur(14) }, { autoAlpha: 1, scale: 1, y: 0, filter: blur(0), duration: 1.0, ease: "expo.out" }, THo);
        tl.fromTo(camHero, cam(960, 540, 1.0), { ...cam(960, 114 + allow.y, 1.9), duration: 1.3, ease: "expo.inOut" }, THo + 0.9);
        const tTap = THo + 2.6;
        tap(P, allow.x - 40, allow.y, tTap, { x: 300, y: 760 });
        tl.to("#allow", { backgroundColor: "#ececec", duration: 0.1 }, tTap);
        tl.to(ms, { y: msY(2), duration: 0.55, ease: "power3.out" }, tTap + 0.6);
        pop($(".pop", msgs[2]), tTap + 0.65);
        tl.to(camHero, { ...cam(960, 540, 0.95), duration: 1.3, ease: "expo.inOut" }, tTap + 1.4);
        const tOut = tTap + 2.9;
        tl.fromTo(camHero, { opacity: 1, filter: blur(0) }, { opacity: 0, filter: blur(16), duration: 0.6, ease: "power2.in", immediateRender: false }, tOut);
        hide("#s-hero", tOut + 0.65);

        /* tagline */
        const TT = tOut + 0.55;
        htSwap(TT - 0.4, true);
        htOn(TT);
        show("#s-end", TT - 0.1);
        wIn("#c-tag", TT, { s: 0.07 });
        wOut("#c-tag", TT + 2.3, { s: 0.03 });

        /* lockup, pinned to its bar */
        const TL = bar(11);
        burst("#burst-lk", TL - 0.36);
        markIn("#lk-mark", "#lk-name", TL);
        wIn("#lk-sub", TL + 0.85, { s: 0.05, d: 0.6 });

        window.__marks = { TM, TY, TW, THo, tTap, tOut, TT, TL };
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      // Layout is measured in script: build only once every face is in, or each render worker
      // gets its own line wraps and the frames flicker between them.
      Promise.all([
        ...Array.from(document.fonts).map((f) => f.load().catch(() => null)),
        document.fonts.load("500 68px Geist"), document.fonts.load("600 16px Geist"), document.fonts.load('400 14px "Geist Mono"'),
      ]).then(() => document.fonts.ready).then(build, build);
    </script>
  </body>
</html>
