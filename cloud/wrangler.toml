name = "codync-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# main: production at api.codync.dev (Clerk production instance)
routes = [{ pattern = "api.codync.dev", custom_domain = true }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ComputerRelay"]

[vars]
CLERK_ISSUER = "https://clerk.codync.dev"

[[d1_databases]]
binding = "DB"
database_name = "codync"
database_id = "858f4ad9-d3b5-4f3b-860f-464803a00017"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "ComputerRelay"

# New computers per IP (POST /v1/host/register).
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Credential issuance per account; separate from registration limits.
[[ratelimits]]
name = "TURN_LIMITER"
namespace_id = "1011"
simple = { limit = 12, period = 60 }

# Public routine webhook deliveries per sender IP and hook (POST /v1/hooks/...).
[[ratelimits]]
name = "HOOK_LIMITER"
namespace_id = "1021"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["*/15 * * * *"]

# dev: our own development deployment. Starts on workers.dev; add a custom domain later.
[env.dev]
name = "codync-cloud-dev"
workers_dev = true
routes = []
vars = { CLERK_ISSUER = "https://sweeping-marmoset-6208.clerk.accounts.dev" }
d1_databases = [{ binding = "DB", database_name = "codync-dev", database_id = "f1a063d1-5b1e-4534-99bc-7231ca1b6d31", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "1002", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "1012", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "1022", simple = { limit = 60, period = 60 } }]
triggers = { crons = ["*/15 * * * *"] }

# local: wrangler dev / e2e with a local D1; CLERK_JWT_KEY is injected by the test (--var).
[env.local]
name = "codync-cloud-local"
routes = []
vars = { CLERK_ISSUER = "https://clerk.test.local" }
d1_databases = [{ binding = "DB", database_name = "codync-local", database_id = "local", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "1003", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "1013", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "1023", simple = { limit = 60, period = 60 } }]
